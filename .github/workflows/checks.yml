name: Code checks
on:
  push:
    paths-ignore:
      - 'dashboard/data/report.json'
      - 'data/history.json'
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install requests defusedxml -r requirements/dev.txt
      - run: ruff check main.py market_insights tests
      - run: black --check main.py market_insights tests
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q main.py market_insights
      - name: Check frontend syntax and strict JSON
        run: |
          for file in dashboard/*.js; do node --check "$file"; done
          node -e 'JSON.parse(require("fs").readFileSync("dashboard/data/report.json", "utf8"))'
